---

media_rt_leaf:
  defaults:
    platform: ceos
    loopback_ipv4_pool: 10.255.255.0/24
    loopback_ipv6_pool: 2001:db8:255:255::/64
    loopback_ipv4_offset: 2
    loopback_ipv6_offset: 2
    uplink_ipv4_pool: 10.255.0.0/24
    uplink_ipv6_pool: 2001:db8:255::/64
    uplink_interface_speed: 400g-4
    uplink_interfaces: [ Ethernet1, Ethernet2 ]
    spanning_tree_priority: 4096
    spanning_tree_mode: mstp
    bgp_defaults:
      - timers bgp 5 15
      - neighbor default send-community
    ptp:
      enabled: true
      free_running:
        enabled: false
    structured_config:
      prefix_lists:
        - name: PL-ANY
          sequence_numbers:
            - sequence: 10
              action: "permit 0.0.0.0/0 le 32"
        - name: PL-MGMT
          sequence_numbers:
            - sequence: 10
              action: "permit 172.16.255.0/24"
      route_maps:
        - name: RM-CONNECTED
          sequence_numbers:
            - sequence: 10
              type: deny
              description: MGMT
              match:
                - "ip address prefix-list PL-MGMT"
            - sequence: 20
              type: permit
              description: ANY
              match:
                - "ip address prefix-list PL-ANY"
      router_bgp:
        redistribute:
          connected:
            enabled: true
            route_map: RM-CONNECTED
  node_groups:
    - group: RT-RACK1
      nodes:
        - name: red-rt-leaf1
          id: 1
          mgmt_ip: 172.16.255.13/24
          ipv6_mgmt_ip: 2001:db8:feed:beef::13/64
          uplink_switches: [ red-spine, red-spine ]
          uplink_switch_interfaces: [ Ethernet3, Ethernet4 ]
          bgp_as: 65201
          structured_config:
            management_cvx:
              shutdown: false
              server_hosts: 
                - 172.16.255.80
              source_interface: Management1
            mcs_client:
              shutdown: false
        - name: blue-rt-leaf1
          id: 2
          mgmt_ip: 172.16.255.14/24
          ipv6_mgmt_ip: 2001:db8:feed:beef::14/64
          uplink_switches: [ blue-spine, blue-spine ]
          uplink_switch_interfaces: [ Ethernet3, Ethernet4 ]
          bgp_as: 65301
          structured_config:
            management_cvx:
              shutdown: false
              server_hosts: 
                - 172.16.255.81
              source_interface: Management1
            mcs_client:
              shutdown: false
    - group: RT-RACK2
      nodes:
        - name: red-rt-leaf2
          id: 3
          mgmt_ip: 172.16.255.15/24
          ipv6_mgmt_ip: 2001:db8:feed:beef::15/64
          uplink_switches: [ red-spine, red-spine ]
          uplink_switch_interfaces: [ Ethernet5, Ethernet6 ]
          bgp_as: 65202
          structured_config:
            management_cvx:
              shutdown: false
              server_hosts: 
                - 172.16.255.80
              source_interface: Management1
            mcs_client:
              shutdown: false
        - name: blue-rt-leaf2
          id: 4
          mgmt_ip: 172.16.255.16/24
          ipv6_mgmt_ip: 2001:db8:feed:beef::16/64
          uplink_switches: [ blue-spine, blue-spine ]
          uplink_switch_interfaces: [ Ethernet5, Ethernet6 ]
          bgp_as: 65302
          structured_config:
            management_cvx:
              shutdown: false
              server_hosts: 
                - 172.16.255.81
              source_interface: Management1
            mcs_client:
              shutdown: false
