---

media_spine:
  defaults:
    platform: ceos
    loopback_ipv4_pool: 10.255.255.0/24
    loopback_ipv6_pool: 2001:db8:255:255::/64
    spanning_tree_priority: 4096
    spanning_tree_mode: mstp
    bgp_defaults:
      - timers bgp 5 15
      - neighbor default send-community
    ptp:
      enabled: true
      free_running:
        enabled: false
    filter:
      only_vlans_in_use: true
    structured_config:
      prefix_lists:
        - name: PL-ANY
          sequence_numbers:
            - sequence: 10
              action: "permit 0.0.0.0/0 le 32"
        - name: PL-MGMT
          sequence_numbers:
            - sequence: 10
              action: "permit 172.16.255.0/24"
      route_maps:
        - name: RM-CONNECTED
          sequence_numbers:
            - sequence: 10
              type: deny
              description: MGMT
              match:
                - "ip address prefix-list PL-MGMT"
            - sequence: 20
              type: permit
              description: ANY
              match:
                - "ip address prefix-list PL-ANY"
      router_bgp:
        redistribute:
          connected:
            enabled: true
            route_map: RM-CONNECTED
  node_groups:
    - group: RT-SPINES
      nodes:
        - name: red-spine
          id: 1
          mgmt_ip: 172.16.255.11/24
          ipv6_mgmt_ip: 2001:db8:feed:beef::11/64
          bgp_as: 65200
          structured_config:
            management_cvx:
              shutdown: false
              server_hosts: 
                - 172.16.255.80
              source_interface: Management1
            mcs_client:
              shutdown: false
        - name: blue-spine
          id: 2
          mgmt_ip: 172.16.255.12/24
          ipv6_mgmt_ip: 2001:db8:feed:beef::12/64
          bgp_as: 65300
          structured_config:
            management_cvx:
              shutdown: false
              server_hosts: 
                - 172.16.255.81
              source_interface: Management1
            mcs_client:
              shutdown: false